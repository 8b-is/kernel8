name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml is the single source of truth for channel,
      # components (incl. rust-src — bootloader's build.rs needs it to
      # build its own freestanding UEFI/BIOS stages), and targets. `rustup
      # show` resolves the override and installs anything missing.
      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Test host executor and serial-log validation
        run: |
          rustc --edition=2021 --test tests/host_executor.rs -o /tmp/kernel8-host-tests
          timeout 10 /tmp/kernel8-host-tests
          python3 -m unittest discover -s tests -p 'test_boot_log.py' -v

      - name: Build
        run: cargo build --locked -Z bindeps

      # This kernel's own standard is "verified by running it, not asserted"
      # (see README) — so CI holds itself to the same bar: boot it for real
      # in headless QEMU and grep the serial output for the exact proof
      # lines the README claims, instead of stopping at "it compiled."
      - name: Boot-test in QEMU and verify real milestones
        run: |
          set -o pipefail
          timeout 15 cargo run -Z bindeps -- --no-reboot 2>&1 | tee boot.log || true
          python3 scripts/verify_boot.py boot.log
