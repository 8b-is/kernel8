[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11"
uart_16550 = "0.6"
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
x86_64 = "0.15"
lazy_static = { version = "1.5", features = ["spin_no_std"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
